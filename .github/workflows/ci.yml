name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 配布版に同梱する版に揃える（installer/api-runtime.json）。
          # ここだけ別の版だと、利用者の手元でしか出ない不具合を試験が素通りする。
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run Python fast tests
        if: github.event_name != 'workflow_dispatch'
        run: python -m pytest -m "not slow" --cov=chotto_sashie_api --cov=chotto_sashie_shared
      - name: Run Python all tests
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest --cov=chotto_sashie_api --cov=chotto_sashie_shared
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
